StylesPath = ../styles
MinAlertLevel = error

Packages = RedHat, Std, https://github.com/jdkato/voices/releases/latest/download/Voices.zip

[*.md]
BasedOnStyles = RedHat, Std, Voices, Direct, RedHatVoice

# Both ship at `suggestion`, and the gates run at `error`, so both were
# installed and inert while the same guidance was paid for as prompt text.
RedHat.Headings = error
RedHat.NoGerundsInTitles = error

# Ships at `error` and counts the words in a sentence, which a Markdown table
# row is not. Guidance worth reading, not a reason to refuse a page.
Direct.Length = warning
