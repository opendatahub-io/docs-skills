name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install test dependencies
      run: pip install -r requirements.txt

    # The prose layer is a real dependency, not an optional extra: several
    # suites shell out to the binary, and the ones that guard on its absence
    # would silently stop covering anything without it.
    - name: Install Vale
      uses: errata-ai/vale-action@v2.1.1
      with:
        version: 3.21.0
        files: README.md
        fail_on_error: false

    - name: Sync the Vale style packages
      run: make sync-styles

    - name: Run tests
      run: python3 -m pytest tests/ -v
