extends: script
message: "Claim without a source. Add a URL or a [src:...] marker."
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  lines := text.split(scope, "\n")
  n := len(lines)
  offset := 0
  idx := 0

  if n > 0 && text.trim_space(lines[0]) == "---" {
      offset += len(lines[0]) + 1
      idx = 1
      for ; idx < n; idx++ {
          line := lines[idx]
          trimmed := text.trim_space(line)
          offset += len(line) + 1
          if trimmed == "---" {
              idx++
              break
          }
      }
  }

  in_fence := false
  fence_marker := ""
  for ; idx < n; idx++ {
      line := lines[idx]
      line_len := len(line)
      trimmed := text.trim_space(line)

      if in_fence {
          if text.has_prefix(trimmed, fence_marker) {
              in_fence = false
          }
          offset += line_len + 1
          continue
      }
      if text.has_prefix(trimmed, "```") {
          in_fence = true
          fence_marker = "```"
          offset += line_len + 1
          continue
      }
      if text.has_prefix(trimmed, "~~~") {
          in_fence = true
          fence_marker = "~~~"
          offset += line_len + 1
          continue
      }

      is_bullet := text.has_prefix(line, "- ") || text.has_prefix(line, "* ")
      has_cite := text.contains(line, "https://") || text.contains(line, "http://") || text.contains(line, "[src:")
      if is_bullet && !has_cite {
          matches = append(matches, {begin: offset, end: offset + line_len})
      }
      offset += line_len + 1
  }
