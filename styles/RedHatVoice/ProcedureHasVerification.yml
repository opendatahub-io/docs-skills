extends: script
message: "A procedure topic needs a '## Verification' heading."
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  lines := text.split(scope, "\n")
  n := len(lines)
  offset := 0
  idx := 0
  applies := false

  if n > 0 && text.trim_space(lines[0]) == "---" {
      offset += len(lines[0]) + 1
      idx = 1
      for ; idx < n; idx++ {
          line := lines[idx]
          trimmed := text.trim_space(line)
          offset += len(line) + 1
          if trimmed == "---" {
              idx++
              break
          }
          if text.has_prefix(trimmed, "type:") {
              value := text.trim_space(text.trim_prefix(trimmed, "type:"))
              value = text.trim(value, "\"'")
              // `task` is the name this project used before the rename, and a
              // document written under it is still a procedure. The quotes are
              // stripped because `type: "procedure"` is legal YAML that an
              // exact comparison read as a non-match, silently switching an
              // error-level rule off.
              if value == "procedure" || value == "task" {
                  applies = true
              }
          }
      }
  }

  found := false
  if applies {
      in_fence := false
      fence_marker := ""
      for ; idx < n; idx++ {
          line := lines[idx]
          trimmed := text.trim_space(line)

          if in_fence {
              if text.has_prefix(trimmed, fence_marker) {
                  in_fence = false
              }
          } else if text.has_prefix(trimmed, "```") {
              in_fence = true
              fence_marker = "```"
          } else if text.has_prefix(trimmed, "~~~") {
              in_fence = true
              fence_marker = "~~~"
          } else if trimmed == "## Verification" {
              found = true
              break
          }
      }
  }

  if applies && !found {
      matches = append(matches, {begin: 0, end: 1})
  }
